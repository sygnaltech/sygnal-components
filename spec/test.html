
<style>
  .timer-outer {
    position: relative;
    display: flex;
    gap: 10px; /* відстань між колами */
    padding: 10px 20px; /* відступ білого овала */
    background: #ffffff;
    border-radius: 999px;
    width: fit-content;
    align-items: center;
  }

  .timer-circle {
    position: relative;
    width: 80px;
    height: 80px;
  }

  .timer-svg {
    transform: rotate(-90deg);
  }

  .timer-bg {
    fill: #8b3f12;
  }

  .timer-dots circle {
    fill: #f6c322;
    r: 1; /* діаметр 0.5px */
  }

  .timer-progress {
    fill: none;
    stroke: #f6c322;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 251;
    stroke-dashoffset: 251;
    transition: stroke-dashoffset 0.6s linear;
  }

  .timer-number {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    font-weight: 700;
    color: #ffffff;
    font-family: Arial, sans-serif;
  }
</style>

<div class="timer-outer">
  <!-- HOURS -->
  <div class="timer-circle">
    <svg class="timer-svg" width="80" height="80" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="40" class="timer-bg"></circle>
      <circle cx="48" cy="48" r="40" class="timer-progress" id="ph" style="stroke-dashoffset: 250.858;"></circle>
      <g class="timer-dots"><circle cx="86" cy="48" r="0.25" fill="#f6c322"></circle><circle cx="80.90896534380867" cy="67" r="0.25" fill="#f6c322"></circle><circle cx="67" cy="80.90896534380866" r="0.25" fill="#f6c322"></circle><circle cx="48" cy="86" r="0.25" fill="#f6c322"></circle><circle cx="29.000000000000007" cy="80.90896534380867" r="0.25" fill="#f6c322"></circle><circle cx="15.091034656191326" cy="67" r="0.25" fill="#f6c322"></circle><circle cx="10" cy="48.00000000000001" r="0.25" fill="#f6c322"></circle><circle cx="15.091034656191333" cy="28.999999999999996" r="0.25" fill="#f6c322"></circle><circle cx="28.999999999999982" cy="15.09103465619134" r="0.25" fill="#f6c322"></circle><circle cx="47.99999999999999" cy="10" r="0.25" fill="#f6c322"></circle><circle cx="67" cy="15.091034656191333" r="0.25" fill="#f6c322"></circle><circle cx="80.90896534380866" cy="28.999999999999982" r="0.25" fill="#f6c322"></circle></g>
    </svg>
    <div class="timer-number" id="hours">23</div>
  </div>

  <!-- MINUTES -->
  <div class="timer-circle">
    <svg class="timer-svg" width="80" height="80" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="40" class="timer-bg"></circle>
      <circle cx="48" cy="48" r="40" class="timer-progress" id="pm" style="stroke-dashoffset: 246.817;"></circle>
      <g class="timer-dots"><circle cx="86" cy="48" r="0.25" fill="#f6c322"></circle><circle cx="80.90896534380867" cy="67" r="0.25" fill="#f6c322"></circle><circle cx="67" cy="80.90896534380866" r="0.25" fill="#f6c322"></circle><circle cx="48" cy="86" r="0.25" fill="#f6c322"></circle><circle cx="29.000000000000007" cy="80.90896534380867" r="0.25" fill="#f6c322"></circle><circle cx="15.091034656191326" cy="67" r="0.25" fill="#f6c322"></circle><circle cx="10" cy="48.00000000000001" r="0.25" fill="#f6c322"></circle><circle cx="15.091034656191333" cy="28.999999999999996" r="0.25" fill="#f6c322"></circle><circle cx="28.999999999999982" cy="15.09103465619134" r="0.25" fill="#f6c322"></circle><circle cx="47.99999999999999" cy="10" r="0.25" fill="#f6c322"></circle><circle cx="67" cy="15.091034656191333" r="0.25" fill="#f6c322"></circle><circle cx="80.90896534380866" cy="28.999999999999982" r="0.25" fill="#f6c322"></circle></g>
    </svg>
    <div class="timer-number" id="minutes">59</div>
  </div>

  <!-- SECONDS -->
  <div class="timer-circle">
    <svg class="timer-svg" width="80" height="80" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="40" class="timer-bg"></circle>
      <circle cx="48" cy="48" r="40" class="timer-progress" id="ps" style="stroke-dashoffset: 46.0167;"></circle>
      <g class="timer-dots"><circle cx="86" cy="48" r="0.25" fill="#f6c322"></circle><circle cx="80.90896534380867" cy="67" r="0.25" fill="#f6c322"></circle><circle cx="67" cy="80.90896534380866" r="0.25" fill="#f6c322"></circle><circle cx="48" cy="86" r="0.25" fill="#f6c322"></circle><circle cx="29.000000000000007" cy="80.90896534380867" r="0.25" fill="#f6c322"></circle><circle cx="15.091034656191326" cy="67" r="0.25" fill="#f6c322"></circle><circle cx="10" cy="48.00000000000001" r="0.25" fill="#f6c322"></circle><circle cx="15.091034656191333" cy="28.999999999999996" r="0.25" fill="#f6c322"></circle><circle cx="28.999999999999982" cy="15.09103465619134" r="0.25" fill="#f6c322"></circle><circle cx="47.99999999999999" cy="10" r="0.25" fill="#f6c322"></circle><circle cx="67" cy="15.091034656191333" r="0.25" fill="#f6c322"></circle><circle cx="80.90896534380866" cy="28.999999999999982" r="0.25" fill="#f6c322"></circle></g>
    </svg>
    <div class="timer-number" id="seconds">11</div>
  </div>
</div>

<script>
  const FULL = 24 * 60 * 60;
  let t = FULL;
  const CIRC = 251;

  function setProgress(id, value, max) {
    const offset = CIRC - (value / max) * CIRC;
    document.getElementById(id).style.strokeDashoffset = offset;
  }

  function tick() {
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;

    hours.textContent = String(h).padStart(2,"0");
    minutes.textContent = String(m).padStart(2,"0");
    seconds.textContent = String(s).padStart(2,"0");

    setProgress("ph", FULL - t, FULL);
    setProgress("pm", 60 - m, 60);
    setProgress("ps", 60 - s, 60);

    if (t > 0) t--;
  }

  tick();
  setInterval(tick, 1000);

  // Додаємо рівномірні жовті точки всередину коричневого кола
  document.querySelectorAll('.timer-circle').forEach(circle => {
    const dotsGroup = circle.querySelector('.timer-dots');
    const cx = 48, cy = 48; // центр кола
    const radius = 38; // відступ 2px від краю (коричневий радіус 40px)
    const numDots = 12;
    for (let i = 0; i < numDots; i++) {
      const angle = (i / numDots) * 2 * Math.PI;
      const x = cx + radius * Math.cos(angle);
      const y = cy + radius * Math.sin(angle);
      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("cx", x);
      dot.setAttribute("cy", y);
      dot.setAttribute("r", 0.25);
      dot.setAttribute("fill", "#f6c322");
      dotsGroup.appendChild(dot);
    }
  });
</script>
